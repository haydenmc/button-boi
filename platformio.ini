; button-boi — battery-powered timestamp button (ESP32-S3 / TinyS3)
;
; Build-time options (button/LED GPIOs, timings) live in src/Kconfig.projbuild.
; Change them with `pio run -t menuconfig` or by adding CONFIG_BB_* lines to
; sdkconfig.defaults (then delete sdkconfig.tinys3 so it is regenerated).

[platformio]
default_envs = tinys3

[env:tinys3]
platform = espressif32@8.0.0
board = um_tinys3
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Host-side unit tests for the flash ring-log logic: `pio test -e native`
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<event_log_core.c>
build_flags = -std=c11 -Wall -Wextra -Werror
